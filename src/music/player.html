<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexus · Apple Music</title><link rel="stylesheet" href="./player.css"></head><body>
<main><p class="eyebrow">NEXUS / REPRODUTOR</p><h1>Apple Music</h1><p>Conecte sua conta para tocar músicas pedidas no jogo. Depois, mantenha esta aba aberta.</p>
