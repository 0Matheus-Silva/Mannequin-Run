<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Pisos da chegada</title></head><body><pre id="result">RUNNING</pre><iframe id="frame" src="../index.html" width="960" height="540"></iframe><script type="module">
const rows=[],check=(v,n)=>{if(!v)throw Error(n);rows.push('PASS '+n);};
try{
const frame=document.querySelector('#frame');for(let n=0;n<180;n++){if(frame.contentDocument?.querySelector('#status')?.textContent.includes('SISTEMAS ONLINE'))break;await new Promise(r=>setTimeout(r,100));}
const doc=frame.contentDocument,ready=new Promise(r=>doc.addEventListener('ready-test',e=>r(e.detail),{once:true})),script=doc.createElement('script');script.type='module';script.textContent="import {game} from './src/main.js';document.dispatchEvent(new CustomEvent('ready-test',{detail:game}));";doc.body.append(script);const game=await ready;game.renderer.setAnimationLoop(null);game.audio.setEnabled(false);game.clock.getDelta=()=>0;game.chooseMode('story');game.startRun();game.startEnding();
const ranges=Object.entries(game.finale.groundSurfaces).map(([name,m])=>({name,min:m.position.z-m.scale.z/2,max:m.position.z+m.scale.z/2,top:m.position.y+m.scale.y/2}));
const road=ranges.find(r=>r.name==='road'),hall=ranges.find(r=>r.name==='hall'),auditorium=ranges.find(r=>r.name==='auditorium');
check(road.min===hall.max,'Rua termina exatamente na entrada do corredor, sem sobreposição');check(hall.min===auditorium.max,'Corredor encontra auditório sem pisos coplanares sobrepostos');check(hall.top===0&&auditorium.top===0,'Corredor e auditório preservam altura de caminhada');
for(let z=-210;z<170;z+=.13){const count=ranges.filter(r=>z>r.min&&z<r.max).length;if(count!==1)throw Error('Piso duplicado ou vão em z='+z);}check(true,'Trajeto inteiro tem uma superfície principal por trecho, sem buracos');
for(const t of [5,10,13,16,18,21,25,32]){game.finale.elapsed=t;game.update();if(!game.finale.hall.visible||!game.finale.auditorium.visible)throw Error('Piso desapareceu');}check(true,'Pisos permanecem visíveis durante chegada, salto e premiação');
check(game.finale.podiumParts.every(p=>p.position.y-p.scale.y/2>=.359),'Bases dos pódios continuam apoiadas no palco');check(!game.renderer.info.programs.some(p=>p.diagnostics?.runnable===false),'Geometrias e materiais compilam no navegador');
document.querySelector('#result').textContent=rows.join('\n')+'\nALL PASS';
}catch(e){document.querySelector('#result').textContent=rows.join('\n')+'\nFAIL '+e.stack;}
</script></body></html>
