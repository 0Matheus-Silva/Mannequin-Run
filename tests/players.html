<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Perfis e persistência MySQL</title></head><body><pre id="result">RUNNING</pre><iframe id="frame" src="../index.html" width="960" height="540"></iframe><script type="module">
import {LocalStore} from '../src/players/LocalStore.js';
const rows=[],check=(v,n)=>{if(!v)throw Error(n);rows.push('PASS '+n);document.querySelector('#result').textContent=rows.join('\n')+'\nRUNNING';};let players,ids=[],restoreApi,restoreFlush;
try{
 const frame=document.querySelector('#frame');for(let n=0;n<180;n++){if(frame.contentDocument?.querySelector('#status')?.textContent.includes('SISTEMAS ONLINE'))break;await new Promise(r=>setTimeout(r,100));}
 const doc=frame.contentDocument;const ready=new Promise(resolve=>doc.addEventListener('qa-ready',e=>resolve(e.detail),{once:true}));const script=doc.createElement('script');script.type='module';script.textContent="import {game,players,assistant} from './src/main.js';document.dispatchEvent(new CustomEvent('qa-ready',{detail:{game,players,assistant}}));";doc.body.append(script);const state=await ready;players=state.players;const {game,assistant}=state;game.renderer.setAnimationLoop(null);game.audio.setEnabled(false);game.clock.getDelta=()=>0;await players.ready;
 check(!!players.local,'IndexedDB de perfis inicializa sem dependência externa');await players.requestStart(()=>{});check(doc.querySelector('#players-dialog').open,'Início sem perfil pede identificação');doc.querySelector('#players-dialog').close();players.pendingStart=null;
 doc.querySelector('#player-search').value='QA browser '+crypto.randomUUID().slice(0,8);await players.create();ids.push(players.current.id);const first=players.current;while(players.flushing)await new Promise(r=>setTimeout(r,20));await players.flush();
 await players.create();ids.push(players.current.id);check(first.id!==players.current.id&&first.name===players.current.name,'Nomes iguais criam perfis diferentes');while(players.flushing)await new Promise(r=>setTimeout(r,20));await players.flush();
 await players.select(first);game.chooseMode('story');game.startRun('campaign');game.track.reset();game.session.distance=599.99;game.session.time=40;game.advance(.01);await players.tail;while(players.flushing)await new Promise(r=>setTimeout(r,20));await players.flush();let profile=await players.api('/api/players/'+first.id);check(profile.last_checkpoint===600&&profile.checkpoints.length===1,'Checkpoint é confirmado automaticamente no MySQL');
 await players.select(profile);await players.resume();check(game.session.distance===600&&!game.session.practice&&game.session.resumed&&game.session.items===profile.checkpoints[0].items,'Continuar História restaura checkpoint válido como campanha');
 game.session.distance=650;game.session.time=45;game.crash();await players.tail;while(players.flushing)await new Promise(r=>setTimeout(r,20));await players.flush();profile=await players.api('/api/players/'+first.id);check(profile.best_score===6500&&profile.history.some(r=>r.result==='crashed'),'Game Over salva partida e recorde pessoal');
 const ranking=await players.api('/api/ranking?mode=story');check(ranking.some(r=>r.player_id===first.id),'Ranking inclui resultado concluído');
 const fetcher=players.api.bind(players),oldFlush=players.flush;restoreApi=fetcher;restoreFlush=oldFlush;players.flush=async()=>{};players.api=async()=>{throw Error('offline simulado');};game.setState('menu');game.chooseMode('infinite');game.beginRun();game.advance(2.65);game.track.reset();game.session.distance=50;game.session.time=4;game.crash();await players.tail;
 check((await players.local.all('outbox')).some(o=>o.payload.result==='crashed'),'Backend indisponível preserva fila durável no navegador');const reopened=await new LocalStore().open();check((await reopened.all('runs')).some(r=>r.playerId===first.id&&r.result==='crashed'&&r.mode==='infinite'),'Reabertura do armazenamento preserva dados após recarregamento');reopened.db.close();players.api=fetcher;players.flush=oldFlush;await players.flush();check(!(await players.local.all('outbox')).length,'Reconexão sincroniza sem perder nem duplicar eventos');
 await assistant.session.start('demo');assistant.session.message('user','Conversa do visitante A');await players.endVisitor();check(assistant.session.history.length===0&&!assistant.session.active&&!players.current,'Próximo visitante limpa perfil, contexto e microfone do chatbot');
 const denied=await fetch('/api/players',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:crypto.randomUUID(),name:'forbidden'})});check(denied.status===403,'Endpoint rejeita escrita sem CSRF');
 for(const path of ['/.env','/server/local-server.js','/.data/backups/example.json','/package.json'])check((await fetch(path)).status===404,'Arquivo privado bloqueado: '+path);
 check((await (await fetch('/api/assistant/config')).json()).voice==='Sadachbia','Proxy preserva configuração do Gemini sem emitir token');
 await new Promise(resolve=>{frame.addEventListener('load',resolve,{once:true});frame.src='../index.html?qa-reload=1';});
 const reloadDoc=frame.contentDocument,reloaded=new Promise(resolve=>reloadDoc.addEventListener('qa-reloaded',e=>resolve(e.detail),{once:true})),reloadScript=reloadDoc.createElement('script');reloadScript.type='module';reloadScript.textContent="import {game,players} from './src/main.js';game.renderer.setAnimationLoop(null);document.dispatchEvent(new CustomEvent('qa-reloaded',{detail:players}));";reloadDoc.body.append(reloadScript);players=await reloaded;restoreApi=null;restoreFlush=null;await players.ready;
 check(Boolean(await players.local.get('profiles',first.id)),'Recarregamento real da página preserva o perfil local');
 const refreshed=await players.api('/api/players/'+first.id);check(refreshed.best_score===6500&&refreshed.history.length>=2&&!players.current,'Recarregamento recupera histórico MySQL e exige selecionar o visitante novamente');
}catch(e){rows.push('FAIL '+e.stack);}finally{
 if(players){if(restoreApi)players.api=restoreApi;if(restoreFlush)players.flush=restoreFlush;clearInterval(players.timer);try{while(players.flushing)await new Promise(r=>setTimeout(r,20));await players.tail;await players.flush();for(const id of ids){await players.api('/api/players/'+id,{method:'DELETE'});await players.local.write([{store:'profiles',delete:true,id},...(await players.local.all('runs')).filter(r=>r.playerId===id).map(r=>({store:'runs',delete:true,id:r.id}))]);}}catch(e){rows.push('FAIL cleanup '+e.message);}}
 document.querySelector('#result').textContent=rows.join('\n')+'\n'+(rows.some(r=>r.startsWith('FAIL'))?'FAILED':'ALL PASS');window.benchmarkDone=true;
}
</script></body></html>
