<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Movement tests</title></head>
<body><pre id="result">RUNNING</pre><script type="module">
import { PlayerController } from '../src/player/PlayerController.js';
import { Input } from '../src/game/Input.js';
const results = [];
const check = (value, label) => { if (!value) throw Error(label); results.push('PASS ' + label); };
try {
  const p = new PlayerController();
  p.move(-1); p.move(-1); check(p.lane === -1, 'Left lane clamp');
  p.update(.02); check(p.x < 0 && p.x > -2.7, 'Lane movement interpolates');
  for (let i=0;i<60;i++) p.update(1/60);
  check(Math.abs(p.x + 2.7) < .001, 'Lane reaches target');
  p.move(1); p.move(1); p.move(1); check(p.lane === 1, 'Right lane clamp');
  check(p.jump(), 'Jump begins on ground'); p.update(.1);
  check(p.y > 0 && !p.jump(), 'Cannot double jump');
  check(!p.slide(), 'Cannot slide in midair');
  for (let i=0;i<120;i++) p.update(1/120);
  check(p.y === 0 && p.velocityY === 0, 'Jump lands consistently');
  check(p.slide(), 'Slide begins on ground'); p.update(.15);
  check(p.height < 1 && p.slideBlend > .9, 'Slide lowers collider and model');
  for (let i=0;i<120;i++) p.update(1/120);
  check(p.height > 2.6 && p.slideTime === 0, 'Slide recovers automatically');
  check(p.jump(), 'Jump can interrupt slide');
  const target = new EventTarget(); const actions = [];
  const input = new Input(action => actions.push(action), target);
  for (const code of ['KeyA','ArrowLeft','KeyD','ArrowRight','Space','ArrowUp','KeyS','ArrowDown','Escape','KeyR']) target.dispatchEvent(new KeyboardEvent('keydown',{code}));
  check(actions.join(',') === 'left,left,right,right,jump,jump,slide,slide,pause,restart', 'All specified keys map correctly');
  target.dispatchEvent(new KeyboardEvent('keydown',{code:'KeyA',repeat:true}));
  check(actions.length === 10, 'Holding key does not repeat actions');
  input.dispose(); target.dispatchEvent(new KeyboardEvent('keydown',{code:'KeyA'}));
  check(actions.length === 10, 'Input listener cleanup');
  document.querySelector('#result').textContent = results.join('\n')+'\nALL PASS';
} catch(e) { document.querySelector('#result').textContent=results.join('\n')+'\nFAIL '+e.stack; }
</script></body></html>
