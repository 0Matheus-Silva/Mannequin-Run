<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}iframe{width:100vw;height:100vh;border:0}</style></head><body><iframe id="frame" src="../index.html"></iframe><script type="module">
const frame=document.querySelector('#frame');for(let n=0;n<180;n++){if(frame.contentDocument?.querySelector('#status')?.textContent.includes('SISTEMAS ONLINE'))break;await new Promise(r=>setTimeout(r,100));}
const doc=frame.contentDocument,ready=new Promise(resolve=>doc.addEventListener('test-ready',e=>resolve(e.detail),{once:true}));const script=doc.createElement('script');script.type='module';script.textContent="import {game,assistant} from './src/main.js';document.dispatchEvent(new CustomEvent('test-ready',{detail:{game,assistant}}));";doc.body.append(script);const {game,assistant}=await ready;game.renderer.setAnimationLoop(null);game.audio.setEnabled(false);game.clock.getDelta=()=>0;if(!new URLSearchParams(location.search).has('menu')){game.startRun();game.advance(.1);}game.update();assistant.expand();assistant.session.voice.speakLocal=()=>false;await assistant.session.start('demo');await assistant.session.send('Como funciona o hardware do manequim?');
</script></body></html>
