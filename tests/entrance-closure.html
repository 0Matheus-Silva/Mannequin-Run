<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><script type="importmap">{"imports":{"three":"../assets/vendor/three/three.module.js"}}</script></head><body><pre id="result">RUNNING</pre><iframe id="frame" src="../index.html" width="960" height="540"></iframe><script type="module">
const rows=[],check=(v,n)=>{if(!v)throw Error(n);rows.push('PASS '+n);};
try{const frame=document.querySelector('#frame');for(let n=0;n<180;n++){if(frame.contentDocument?.querySelector('#status')?.textContent.includes('SISTEMAS ONLINE'))break;await new Promise(r=>setTimeout(r,100));}

}catch(e){document.querySelector('#result').textContent=rows.join('\n')+'\nFAIL '+e.stack;}
</script></body></html>
