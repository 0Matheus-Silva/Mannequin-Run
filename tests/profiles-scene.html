<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}iframe{width:100vw;height:100vh;border:0}</style></head><body><iframe id="frame" src="../index.html"></iframe><script type="module">
const frame=document.querySelector('#frame');for(let n=0;n<180;n++){if(frame.contentDocument?.querySelector('#status')?.textContent.includes('SISTEMAS ONLINE'))break;await new Promise(r=>setTimeout(r,100));}
const doc=frame.contentDocument,ready=new Promise(resolve=>doc.addEventListener('qa-ready',e=>resolve(e.detail),{once:true})),script=doc.createElement('script');script.type='module';script.textContent="import {game,players} from './src/main.js';document.dispatchEvent(new CustomEvent('qa-ready',{detail:{game,players}}));";doc.body.append(script);const {game,players}=await ready;game.renderer.setAnimationLoop(null);game.audio.setEnabled(false);game.clock.getDelta=()=>0;game.update();if(new URLSearchParams(location.search).has('profiles'))await players.open();if(new URLSearchParams(location.search).has('gamepad'))doc.querySelector('#gamepad-open').click();
</script></body></html>
