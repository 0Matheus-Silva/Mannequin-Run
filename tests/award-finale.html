<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Premiação final</title><script type="importmap">{"imports":{"three":"../assets/vendor/three/three.module.js"}}</script></head><body><pre id="result">RUNNING</pre><iframe id="frame" src="../index.html" width="960" height="540"></iframe><script type="module">
import * as THREE from 'three';import {ENDING_DURATION,CREDITS_START} from '../src/story/StoryFinale.js';
const rows=[],check=(v,n)=>{if(!v)throw Error(n);rows.push('PASS '+n);};
try{
const frame=document.querySelector('#frame');for(let n=0;n<180;n++){if(frame.contentDocument?.querySelector('#status')?.textContent.includes('SISTEMAS ONLINE'))break;await new Promise(r=>setTimeout(r,100));}
const doc=frame.contentDocument,ready=new Promise(r=>doc.addEventListener('ready-test',e=>r(e.detail),{once:true})),script=doc.createElement('script');script.type='module';script.textContent="import {game} from './src/main.js';document.dispatchEvent(new CustomEvent('ready-test',{detail:game}));";doc.body.append(script);const game=await ready;game.renderer.setAnimationLoop(null);game.audio.setEnabled(false);game.clock.getDelta=()=>0;game.chooseMode('story');game.startRun();game.startEnding();const finale=game.finale,[chest,plasma]=finale.others,sounds=[];const effect=game.audio.effect.bind(game.audio);game.audio.effect=(name,intensity)=>{sounds.push({name,intensity});effect(name,intensity);};
const show=t=>{finale.elapsed=t;game.update();game.scene.updateMatrixWorld(true);game.camera.updateMatrixWorld(true);};
show(21);
check(finale.podiumParts.every(p=>p.scale.x===4&&new THREE.Box3().setFromObject(p).min.y>=.359),'Caixas ampliadas e apoiadas sobre o palco');
check(chest.root.position.x<0&&plasma.root.position.x>0&&game.player.root.position.x===0,'Ordem 2–1–3: baú, protagonista e aparelho de plasma');
check(finale.podiumStairs.length===0,'Frente dos três pódios livre de escadas');
for(const label of finale.rankSigns){const p=label.getWorldPosition(new THREE.Vector3()),direction=p.clone().sub(game.camera.position),length=direction.length(),ray=new THREE.Raycaster(game.camera.position,direction.normalize());check(!ray.intersectObjects(finale.podiumStairs,true).some(hit=>hit.distance<length-.02),'Número '+label.userData.rank+' livre de oclusão pelas escadas');const projected=p.project(game.camera);check(Math.abs(projected.x)<.9&&Math.abs(projected.y)<.9,'Número '+label.userData.rank+' dentro do enquadramento');}
check(chest.root.userData.kind==='mario'&&chest.tears.visible,'Mario chorando no segundo lugar');
check(plasma.enclosure.userData.acrylic&&plasma.enclosure.material.transparent&&plasma.body.children.length>30,'Terceiro lugar tem caixa acrílica, placa e componentes');
check(!plasma.arcs.visible&&!plasma.fire.visible&&!finale.trophy.visible,'Cerimônia começa sem incêndio nem taça antecipada');
show(22.2);check(plasma.arcs.visible&&sounds.some(s=>s.name==='plasma-charge'),'Sobrecarga aciona chiado e arcos');const low=sounds.at(-1).intensity,arc=plasma.arcs.children[0].geometry.attributes.position.array.slice();show(25.2);check(sounds.at(-1).intensity>low&&arc.some((v,i)=>v!==plasma.arcs.children[0].geometry.attributes.position.array[i]),'Intensidade do som e trajetória dos raios evoluem');
show(25.6);check(plasma.burst.visible&&plasma.flash.visible&&sounds.some(s=>s.name==='plasma-burst'),'Explosão tem faíscas, flash e efeito sonoro');check(plasma.fire.visible&&!plasma.arcs.visible,'Fogo substitui descargas após a explosão');
const fireBox=new THREE.Box3().setFromObject(plasma.fire),chestBox=new THREE.Box3().setFromObject(chest.body),heroBox=new THREE.Box3().setFromObject(game.player.root);check(!fireBox.intersectsBox(chestBox)&&!fireBox.intersectsBox(heroBox)&&fireBox.min.x>3,'Fogo fica restrito ao terceiro pódio');
show(28);check(chest.tears.visible,'Mario continua chorando após a explosão');const tearY=chest.tears.children[0].position.y;show(28.05);check(chest.tears.children[0].position.y!==tearY,'Lágrimas se movem');check(!finale.trophy.visible,'Taça aguarda a reação do segundo colocado');
show(32);check(finale.trophy.visible&&chest.tears.visible,'Entrega da taça começa com Mario no segundo lugar');show(34);check(game.player.arms[1].pivot.rotation.x<-2&&game.player.root.rotation.y===Math.PI,'Protagonista voltado ao público levanta a taça');check(!doc.querySelector('#award-win').hidden&&doc.querySelector('#award-win').textContent.includes('WIN!'),'Mensagem de vitória aparece após a pose');
check(!game.renderer.info.programs.some(p=>p.diagnostics?.runnable===false),'Materiais e efeitos compilam no navegador');
finale.start();finale.seek(34.7);game.update();const waiting=doc.querySelector('#credits-roll').hidden;finale.advance(.1/1.4);game.update();check(ENDING_DURATION===35&&CREDITS_START===34.8&&waiting&&!doc.querySelector('#credits-roll').hidden&&game.player.arms[1].pivot.rotation.x<-2,'Créditos começam no instante em que a taça termina de subir, antes da tela de vitória');
finale.creditElapsed=0;game.update();check(!doc.querySelector('#credits-roll').hidden,'Créditos começam após a espera');finale.creditElapsed=8;game.update();check(!doc.querySelector('#credits-roll').hidden,'Rolagem permanece ativa por quase nove segundos');finale.creditElapsed=9;game.update();check(doc.querySelector('#credits-roll').hidden,'Rolagem encerra aos nove segundos');
finale.start();show(21);check(!plasma.fire.visible&&!plasma.burst.visible&&chest.tears.visible&&!finale.trophy.visible,'Reiniciar restaura os concorrentes e efeitos');
game.setState('menu');check(doc.querySelector('#award-win').hidden,'Menu remove indicação de vitória');game.chooseMode('infinite');game.startRun();game.track.reset();game.session.distance=2401;game.advance(.01);game.update();check(game.state==='playing'&&!finale.root.visible,'Modo Infinito continua sem premiação');
document.querySelector('#result').textContent=rows.join('\n')+'\nALL PASS';
}catch(e){document.querySelector('#result').textContent=rows.join('\n')+'\nFAIL '+e.stack;}
</script></body></html>
