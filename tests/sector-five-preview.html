<!doctype html><html><body style="margin:0"><iframe id="frame" src="../index.html" style="border:0;width:100vw;height:100vh"></iframe><script type="module">
const frame=document.querySelector('#frame');for(let i=0;i<150&&!frame.contentDocument?.querySelector('#status')?.textContent.includes('SISTEMAS ONLINE');i++)await new Promise(r=>setTimeout(r,100));
const doc=frame.contentDocument,ready=new Promise(r=>doc.addEventListener('five-ready',e=>r(e.detail),{once:true})),script=doc.createElement('script');script.type='module';script.textContent="import {game} from './src/main.js';document.dispatchEvent(new CustomEvent('five-ready',{detail:game}));";doc.body.append(script);const game=await ready;game.renderer.setAnimationLoop(null);game.chooseMode('story');game.startRun('machines');game.renderer.setAnimationLoop(null);game.session.distance=2490;game.world.segments.forEach((_,i)=>game.world.replace(i,4));game.world.applyPalette(2490);game.rescue.update(.1,2490,'story');game.player.update(.1,true,game.motion);game.render();
</script></body></html>
