<!doctype html><meta charset="utf-8"><pre id="result">RUNNING</pre><script type="module">
import {MusicBridge} from '../src/music/bridge.js';const result=document.querySelector('#result');
try{
 await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('Reprodutor de teste não iniciou')),5000);addEventListener('message',event=>{if(event.origin===location.origin&&event.data==='music-mock-ready'){clearTimeout(timer);resolve();}});const frame=document.createElement('iframe');frame.hidden=true;frame.src='./music-player-mock.html';document.body.append(frame);});
 const bridge=new MusicBridge(),connected=new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('Estado não recebido')),5000);bridge.addEventListener('change',()=>{if(bridge.status.connected){clearTimeout(timer);resolve();}});});await connected;
 const played=await bridge.command('play','música de teste');if(played.message!=='Teste: play')throw Error('Resposta de reprodução incorreta');
 try{await bridge.command('next');throw Error('Erro da próxima faixa não foi informado');}catch(e){if(e.message!=='Sem próxima faixa')throw e;}
 bridge.close();result.textContent='PASS comunicação entre páginas\nPASS comando e resposta\nPASS erro do reprodutor\nALL PASS';
}catch(e){result.textContent='FAIL '+e.stack;}
</script>
