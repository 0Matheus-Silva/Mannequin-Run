<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><script type="importmap">{"imports":{"three":"../assets/vendor/three/three.module.js"}}</script></head><body><pre id="result">RUNNING</pre><iframe id="frame" src="../index.html" width="960" height="540"></iframe><script type="module">
import * as THREE from 'three';import {awardCamera} from '../src/story/AwardCamera.js';import {Settings} from '../src/utils/Settings.js';
import {DemoProvider} from '../src/assistant/DemoProvider.js';
const rows=[],check=(v,n)=>{if(!v)throw Error(n);rows.push('PASS '+n);};
try{
let previous=awardCamera(21);for(let t=21.01;t<=33;t+=.01){const current=awardCamera(t);if(current.position.distanceTo(previous.position)>.24||current.target.distanceTo(previous.target)>.22||current.position.z<-2)throw Error('Corte ou invasão do palco');previous=current;}check(true,'Travelling e zoom contínuos sem cortes nem atravessar o palco');
check(awardCamera(23).position.x===4.4&&awardCamera(28).position.x===-4.4&&awardCamera(33).position.x===0,'Ordem de foco: terceiro, segundo e primeiro');
check(awardCamera(23).fov<awardCamera(21).fov,'Zoom progressivo individual conserva contexto');
const frame=document.querySelector('#frame');for(let n=0;n<180;n++){if(frame.contentDocument?.querySelector('#status')?.textContent.includes('SISTEMAS ONLINE'))break;await new Promise(r=>setTimeout(r,100));}
const doc=frame.contentDocument,ready=new Promise(r=>doc.addEventListener('ready-test',e=>r(e.detail),{once:true})),script=doc.createElement('script');script.type='module';script.textContent="import {game} from './src/main.js';document.dispatchEvent(new CustomEvent('ready-test',{detail:game}));";doc.body.append(script);const game=await ready;game.renderer.setAnimationLoop(null);game.audio.setEnabled(false);game.clock.getDelta=()=>0;game.chooseMode('story');game.startRun();game.startEnding();
const show=t=>{game.finale.elapsed=t;game.update();game.scene.updateMatrixWorld(true);game.camera.updateMatrixWorld(true);};
const fits=object=>{const bounds=new THREE.Box3().setFromObject(object);return [bounds.min.x,bounds.max.x].every(x=>[bounds.min.y,bounds.max.y].every(y=>[bounds.min.z,bounds.max.z].every(z=>{const p=new THREE.Vector3(x,y,z).project(game.camera);return Math.abs(p.x)<.98&&Math.abs(p.y)<.98;})));};
show(21);check(game.finale.podiumParts.every(fits)&&game.finale.rankSigns.every(fits),'Plano aberto apresenta caixas e números 2–1–3 completos');
show(24);check(fits(game.finale.others[1].body)&&game.camera.position.x===4.4,'Aparelho completo e componentes no close do terceiro');
show(28.2);check(fits(game.finale.others[0].root)&&game.camera.position.x===-4.4,'Baú, língua e lágrimas completos durante a reação');
show(34);check(fits(game.player.root)&&fits(game.finale.trophy)&&game.camera.position.x===0,'Protagonista e troféu completos no close da vitória');
check(!doc.querySelector('#award-win').hidden&&doc.querySelector('#award-win').textContent.includes('WIN!'),'WIN e primeiro lugar após levantar a taça');
game.audio.setCeremonyDucking(28);check(game.audio.musicDuck===.24,'Música reduz durante a fala');game.audio.setCeremonyDucking(null);check(game.audio.musicDuck===1,'Música recupera volume após cerimônia');
const fresh=new Settings({getItem:()=>null}),saved=new Settings({getItem:()=>JSON.stringify({volume:.2,musicVolume:.1,effectsVolume:.3})});check(fresh.volume===.65&&fresh.musicVolume===.6&&fresh.effectsVolume===.85,'Padrões de mixagem mais presentes');check(saved.volume===.2&&saved.musicVolume===.1&&saved.effectsVolume===.3,'Volumes personalizados preservados');
const config=await(await fetch('../assets/assistant/live-config.json')).json(),personality=await(await fetch('../assets/assistant/personality.json')).json();check(config.voice==='Sadachbia'&&config.language==='pt-BR','Voz Sadachbia e idioma centralizados');check(['português brasileiro','sarcasmo leve','uma a três frases','Não execute'].every(s=>personality.instruction.includes(s)),'Personalidade expressiva, breve e ancorada na base oficial');
const knowledge=await(await fetch('../assets/assistant/knowledge.json')).json(),demo=new DemoProvider(knowledge,personality);
for(const [question,expected] of [['Como jogar?','Espaço'],['Qual tecnologia foi usada?','Three.js'],['Qual processador e RAM?','Não há especificações'],['Você é consciente?','Não sou uma consciência'],['Como é o modo infinito?','Infinito']])check((await demo.reply(question)).includes(expected),'Pergunta local: '+question);
check(knowledge.presentation.includes('?')&&knowledge.presentation.includes('experimentar'),'Apresentação convida a conversar e experimentar o jogo');
document.querySelector('#result').textContent=rows.join('\n')+'\nALL PASS';
}catch(e){document.querySelector('#result').textContent=rows.join('\n')+'\nFAIL '+e.stack;}
</script></body></html>
