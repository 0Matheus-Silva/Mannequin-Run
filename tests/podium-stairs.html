<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Pirueta</title><script type="importmap">{"imports":{"three":"../assets/vendor/three/three.module.js"}}</script></head><body><pre id="result">RUNNING</pre><iframe id="frame" src="../index.html" width="960" height="540"></iframe><script type="module">
import * as THREE from 'three';import {podiumWalk,podiumTiming,arrivalTravel} from '../src/story/StoryFinale.js';
const rows=[],check=(v,n)=>{if(!v)throw Error(n);rows.push('PASS '+n);};
try{
for(const speed of [12,20,28]){const timing=podiumTiming(speed);let before=arrivalTravel(timing.start,speed)-podiumWalk(timing.start,speed).z;for(let t=timing.start+.01;t<timing.landing;t+=.01){const current=arrivalTravel(t,speed)-podiumWalk(t,speed).z;if(current<=before)throw Error('Pausa em '+speed);before=current;}const middle=podiumWalk(timing.stairs+.525,speed),land=podiumWalk(timing.landing,speed);check(middle.jumping&&middle.y>3.5&&middle.spin>3&&Math.abs(land.z+10)<.001&&Math.abs(land.y-2.16)<.001,'Salto contínuo e pouso em '+speed+' m/s');}
const frame=document.querySelector('#frame');for(let n=0;n<180;n++){if(frame.contentDocument?.querySelector('#status')?.textContent.includes('SISTEMAS ONLINE'))break;await new Promise(r=>setTimeout(r,100));}
const doc=frame.contentDocument,ready=new Promise(r=>doc.addEventListener('ready-test',e=>r(e.detail),{once:true})),script=doc.createElement('script');script.type='module';script.textContent="import {game} from './src/main.js';document.dispatchEvent(new CustomEvent('ready-test',{detail:game}));";doc.body.append(script);const game=await ready;game.renderer.setAnimationLoop(null);game.audio.setEnabled(false);game.clock.getDelta=()=>0;game.chooseMode('story');game.startRun();game.startEnding();const timing=podiumTiming(game.finale.arrivalSpeed);
const show=t=>{game.finale.elapsed=t;game.update();game.scene.updateMatrixWorld(true);game.camera.updateMatrixWorld(true);};
show(timing.stairs+.525);check(game.finale.podiumStairs.length===0,'Frente sem escadas');check(game.player.body.rotation.y>3&&game.player.legs.every(leg=>leg.joint.rotation.x<-.7),'Pirueta com joelhos recolhidos');
let last=podiumWalk(timing.start,game.finale.arrivalSpeed);for(let t=timing.start+.01;t<timing.end;t+=.01){const current=podiumWalk(t,game.finale.arrivalSpeed);if(Math.abs(current.y-last.y)>.13||Math.abs(current.z-last.z)>.13)throw Error('Salto de posição');show(t);const bounds=new THREE.Box3().setFromObject(game.player.root);for(const x of [bounds.min.x,bounds.max.x])for(const y of [bounds.min.y,bounds.max.y])for(const z of [bounds.min.z,bounds.max.z]){const p=new THREE.Vector3(x,y,z).project(game.camera);if(Math.abs(p.x)>1||Math.abs(p.y)>1)throw Error('Pirueta cortada: t='+t+' x='+p.x+' y='+p.y+' bounds='+bounds.min.toArray()+'/'+bounds.max.toArray());}last=current;}check(true,'Movimento contínuo e corpo inteiro no quadro');
show(timing.landing+.125);check(game.player.body.position.y<0&&Math.abs(game.player.root.position.y-2.16)<.001,'Pouso amortecido');show(timing.end+.01);check(game.player.root.position.z===-10&&game.player.root.position.y===2.16&&game.player.root.rotation.y===Math.PI,'Termina centralizado e voltado ao público');show(21);check(game.finale.rankSigns.map(s=>s.userData.rank).join('')==='213'&&!game.finale.trophy.visible,'Ordem e números preservados');show(34);check(game.finale.trophy.visible&&game.player.arms[1].pivot.rotation.x<-2,'Taça preservada');
game.finale.seek(timing.end-.01);game.update();const beforeCamera=game.camera.position.clone();game.finale.advance(.02);game.update();check(game.finale.elapsed>=21&&game.finale.elapsed<21.1&&game.camera.position.distanceTo(beforeCamera)<.02,'Pouso emenda nas apresentações sem espera nem corte de câmera');
document.querySelector('#result').textContent=rows.join('\n')+'\nALL PASS';
}catch(e){document.querySelector('#result').textContent=rows.join('\n')+'\nFAIL '+e.stack;}
</script></body></html>
