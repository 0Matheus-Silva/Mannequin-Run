<!doctype html><meta charset="utf-8"><style>html,body{margin:0;background:#000}iframe{width:100vw;height:100vh;border:0}</style><iframe id="frame" src="../index.html"></iframe><script type="module">
const frame=document.querySelector('#frame');for(let i=0;i<200&&!frame.contentDocument?.querySelector('#status')?.textContent.includes('SISTEMAS ONLINE');i++)await new Promise(r=>setTimeout(r,100));
const doc=frame.contentDocument,ready=new Promise(resolve=>doc.addEventListener('route-view',e=>resolve(e.detail),{once:true})),script=doc.createElement('script');script.type='module';script.textContent="import {game} from './src/main.js';document.dispatchEvent(new CustomEvent('route-view',{detail:game}));";doc.body.append(script);const game=await ready;
game.renderer.setAnimationLoop(null);game.audio.setEnabled(false);game.chooseMode('story');game.startRun();game.track.reset();game.session.distance=Number(new URLSearchParams(location.search).get('distance')||1550);game.sector=2;game.world.segments.forEach((_,i)=>game.world.replace(i,2));game.world.applyPalette(game.session.distance);game.atmosphere.update(game.session.distance);game.elevatedRoute.update(game.session.distance);
const elevation=game.session.distance<1492?Math.max(0,(game.session.distance-1460)/32*5.2):5.2;game.player.update(.016,true,game.motion);game.player.root.position.y=elevation;game.camera.position.set(0,3.8+elevation,7);game.target.set(0,1.4+elevation,-7);game.camera.lookAt(game.target);game.ui.update(game.session);game.render();
</script>
